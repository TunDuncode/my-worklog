baseURL: "https://mellow-marzipan-18443a.netlify.app/"
title: ""
theme: "hugo-book"
defaultContentLanguage: "en"

languages:
  en:
    languageName: "English"
    weight: 1
    contentDir: "content/en"

params:
  BookTheme: "light"         # Chuyển sang giao diện sáng (giống hệt ảnh mẫu)
  BookSearch: true           # Bật thanh tìm kiếm
  BookSection: "*"           # Hiển thị tất cả các thư mục cấp cao nhất trong menu
  BookToC: true              # Bật mục lục bên phải
  BookLogo: "/aws-logo.png"  # Đường dẫn logo góc trái
  BookFooter: "Last Updated 22-07-2026 | Team: First Cloud AI Journey" # Chữ ở cuối trang
  collapsibleMenu : true

markup:
  goldmark:
    renderer:
      unsafe: true             # Cho phép hiển thị HTML trong file markdown

menu:
  before:
    - name: "1. Worklog"
      pageRef: "/1-worklog"
      weight: 10
    - name: "2. Proposal"
      pageRef: "/2-proposal"
      weight: 20
    - name: "3. Blogs Posted"
      pageRef: "/3-blogs"
      weight: 30
    - name: "4. Events Participated"
      pageRef: "/4-events"
      weight: 40
    - name: "5. Workshop"
      pageRef: "/5-workshop"
      weight: 50
    - name: "6. Self-Assessment"
      pageRef: "/6-assessment"
      weight: 60
    - name: "7. Sharing and Feedback"
      pageRef: "/7-feedback"
      weight: 70
  after:
    - name: "MORE"                 # Tạo tiêu đề "MORE"
      weight: 80
    - name: "AWS Study Group - Blog"
      url: "https://cloudjourney.awsstudygroup.com/"
      weight: 90
    - name: "AWS Study Group - FB Group"
